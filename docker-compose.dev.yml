version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dodo
    ports:
      - "5433:5432"
    volumes:
      - ./.db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  invoice-service:
    build:
      context: .
      dockerfile: docker/invoice-service.dev.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:root@postgres:5432/dodo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source so changes hot-reload via nodemon
      - ./src:/app/src
      - ./apps:/app/apps
      # Anonymous volume so container's node_modules aren't overwritten by host mount
      - /app/node_modules

  mock-psp:
    build:
      context: .
      dockerfile: docker/mock-psp.dev.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./apps:/app/apps
      - /app/node_modules


